<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C88FF" />
      <stop offset="100%" stop-color="#57EAB6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#141D3C" />
  <g filter="url(#shadow)">
    <!-- Left Pillar (Healtho Blue #6C88FF) -->
    <rect x="22" y="22" width="12" height="56" rx="6" fill="#6C88FF" />
    <!-- Right Pillar (Healtho Mint #57EAB6) -->
    <rect x="66" y="22" width="12" height="56" rx="6" fill="#57EAB6" />
    <!-- Pulse Waveform Crossbar (Gradient Blue to Mint) -->
    <path d="M 31 50 L 41 50 L 44 42 L 49 62 L 54 36 L 58 50 L 69 50" fill="none" stroke="url(#pulseGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
